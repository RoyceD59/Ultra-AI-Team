openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: members
    description: Team member operations
  - name: projects
    description: Project operations
  - name: tasks
    description: Task operations
  - name: dashboard
    description: Cross-project dashboard operations
  - name: anthropic
    description: Anthropic AI chat operations
  - name: ai-monitor
    description: AI project monitoring and Ultra Clear AI integration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List team members
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a team member
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a team member
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a team member
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: List of projects with progress info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectWithProgress"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /projects/{id}/summary:
    get:
      operationId: getProjectSummary
      tags: [projects]
      summary: Get task breakdown and progress for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "404":
          description: Not found

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks, optionally filtered
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: integer
        - name: assigneeId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Cross-project totals and status breakdown
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Recently created or updated tasks across all projects
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /ai/query:
    post:
      operationId: aiQuery
      tags: [ai-monitor]
      summary: Inbound webhook — Ultra Clear AI asks a question about projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiQueryInput"
      responses:
        "200":
          description: AI-generated answer with live project context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiQueryAnswer"

  /ai/report:
    get:
      operationId: getAiReport
      tags: [ai-monitor]
      summary: Get the latest generated project report
      responses:
        "200":
          description: Latest AI report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReport"
    post:
      operationId: generateAiReport
      tags: [ai-monitor]
      summary: Generate a fresh AI project status report
      responses:
        "200":
          description: Freshly generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReport"

  /ai/push:
    post:
      operationId: pushToOrchestrator
      tags: [ai-monitor]
      summary: Manually push current project summary to Ultra Clear AI orchestrator
      responses:
        "200":
          description: Push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPushResult"

components:
  parameters:
    MemberId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    TaskStatus:
      type: string
      enum: [todo, in_progress, in_review, done]

    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]

    ProjectStatus:
      type: string
      enum: [planning, active, on_hold, completed]

    Member:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }

    MemberInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        role: { type: string, minLength: 1 }

    MemberUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        role: { type: string, minLength: 1 }

    Project:
      type: object
      required: [id, name, description, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        status:
          $ref: "#/components/schemas/ProjectStatus"
        dueDate:
          type: ["string", "null"]
          format: date
        createdAt: { type: string, format: date-time }

    ProjectWithProgress:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [taskCount, doneCount, progressPercent]
          properties:
            taskCount: { type: integer }
            doneCount: { type: integer }
            progressPercent: { type: number }

    ProjectInput:
      type: object
      required: [name, description, status]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        status:
          $ref: "#/components/schemas/ProjectStatus"
        dueDate:
          type: ["string", "null"]
          format: date

    ProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        status:
          $ref: "#/components/schemas/ProjectStatus"
        dueDate:
          type: ["string", "null"]
          format: date

    ProjectSummary:
      type: object
      required:
        [
          projectId,
          totalTasks,
          progressPercent,
          statusBreakdown,
          priorityBreakdown,
          overdueCount,
        ]
      properties:
        projectId: { type: integer }
        totalTasks: { type: integer }
        progressPercent: { type: number }
        statusBreakdown:
          type: object
          additionalProperties:
            type: integer
        priorityBreakdown:
          type: object
          additionalProperties:
            type: integer
        overdueCount: { type: integer }

    Task:
      type: object
      required:
        [
          id,
          projectId,
          title,
          description,
          status,
          priority,
          assigneeId,
          dueDate,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        title: { type: string }
        description: { type: string }
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaskInput:
      type: object
      required: [projectId, title, status, priority]
      properties:
        projectId: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date

    TaskUpdate:
      type: object
      properties:
        projectId: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date

    DashboardSummary:
      type: object
      required:
        [
          totalProjects,
          activeProjects,
          totalTasks,
          overdueTasks,
          statusBreakdown,
          tasksDueThisWeek,
        ]
      properties:
        totalProjects: { type: integer }
        activeProjects: { type: integer }
        totalTasks: { type: integer }
        overdueTasks: { type: integer }
        tasksDueThisWeek: { type: integer }
        statusBreakdown:
          type: object
          additionalProperties:
            type: integer

    ActivityItem:
      type: object
      required:
        [
          taskId,
          taskTitle,
          projectId,
          projectName,
          status,
          assigneeName,
          updatedAt,
        ]
      properties:
        taskId: { type: integer }
        taskTitle: { type: string }
        projectId: { type: integer }
        projectName: { type: string }
        status:
          $ref: "#/components/schemas/TaskStatus"
        assigneeName:
          type: ["string", "null"]
        updatedAt: { type: string, format: date-time }

    AnthropicConversation:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, title, createdAt]
    AnthropicMessage:
      type: object
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        role: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, conversationId, role, content, createdAt]
    AnthropicConversationInput:
      type: object
      properties:
        title: { type: string }
      required: [title]
    AnthropicMessageInput:
      type: object
      properties:
        content: { type: string }
      required: [content]
    AnthropicConversationWithMessages:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required: [id, title, createdAt, messages]
    AnthropicError:
      type: object
      properties:
        error: { type: string }
      required: [error]

    AiQueryInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1 }
        source:
          type: string
          description: Identifier of the calling agent (e.g. "orchestrator", "analytics-agent")

    AiQueryAnswer:
      type: object
      required: [answer, generatedAt]
      properties:
        answer: { type: string }
        generatedAt: { type: string, format: date-time }
        source: { type: string }

    AiReport:
      type: object
      required: [summary, highlights, risks, generatedAt]
      properties:
        summary: { type: string }
        highlights:
          type: array
          items: { type: string }
        risks:
          type: array
          items: { type: string }
        generatedAt: { type: string, format: date-time }

    AiPushResult:
      type: object
      required: [success, message, sentAt]
      properties:
        success: { type: boolean }
        message: { type: string }
        sentAt: { type: string, format: date-time }
        webhookUrl: { type: string }
